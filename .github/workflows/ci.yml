name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  # =========================================================================
  # Job 1: Pengujian Otomatis Backend Laravel (CPMK2 Poin c)
  # =========================================================================
  test-backend:
    name: Backend Feature Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, sqlite3, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: backend

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
        working-directory: backend

      - name: Setup Environment & Generate Key
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Execute Feature Tests
        run: php artisan test
        working-directory: backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # =========================================================================
  # Job 2: Kompilasi & Build Frontend Vue.js (CPMK2 Poin c)
  # =========================================================================
  build-frontend:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Vue.js Static Assets
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8000/api

  # =========================================================================
  # Job 3: Continuous Deployment ke GHCR (CPMK3 Poin a, b, c)
  # Hanya dieksekusi saat push ke branch main!
  # =========================================================================
  deploy:
    name: Build & Push Docker Images (GHCR)
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        id: image-names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/${REPO_LOWER}-backend" >> $GITHUB_OUTPUT
          echo "frontend=ghcr.io/${REPO_LOWER}-frontend" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.backend }}:${{ github.sha }}
          build-args: |
            APP_KEY=${{ secrets.APP_KEY }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image-names.outputs.frontend }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000/api
