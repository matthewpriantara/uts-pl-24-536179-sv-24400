services:
  # ==========================================
  # Service 1: Database (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0.36
    container_name: uts_kepl_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kepl_inventaris}
      MYSQL_USER: ${DB_USERNAME:-kepl_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-kepl_secret_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - kepl_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_secret_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Service 2: Backend (FrankenPHP + Laravel)
  # Bonus +10 Nilai CPMK
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts_kepl_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-GudangPro}
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:BscpOmccr6w7ubvIRgxlBre5Cr3V/lDUmXp1leX2DnM=}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-http://localhost:8000}
      LOG_CHANNEL: stdout
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-kepl_inventaris}
      DB_USERNAME: ${DB_USERNAME:-kepl_user}
      DB_PASSWORD: ${DB_PASSWORD:-kepl_secret_password}
      SERVER_NAME: ":8000"
    ports:
      - "8000:8000"
    networks:
      - kepl_network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Service 3: Frontend (Vue.js 3 + Nginx Alpine)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    container_name: uts_kepl_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - kepl_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # MONITORING (Pertemuan 11)
  # ==========================================

  # Service 4: Prometheus (pengumpul & penyimpan metrik)
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: uts_kepl_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus # supaya riwayat metrik tidak hilang saat container diganti
    ports:
      - "127.0.0.1:9090:9090" # hanya bisa dibuka dari laptop sendiri, tidak terbuka ke jaringan
    networks:
      - kepl_network

  # Service 5: Grafana (penggambar dashboard)
  grafana:
    image: grafana/grafana:11.1.0
    container_name: uts_kepl_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Wajib diisi di .env; compose menolak jalan kalau kosong (tidak pernah admin/admin)
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS:?Isi GRAFANA_PASS di file .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - kepl_network

  # Service 6: cAdvisor (CPU & memori tiap container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: uts_kepl_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - kepl_network

  # Service 7: Node Exporter (metrik mesin/server)
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: uts_kepl_node_exporter
    restart: unless-stopped
    networks:
      - kepl_network

# Persistent Named Volume (Data basis data tetap aman saat container down)
volumes:
  db_data:
    name: uts_kepl_db_data
  prom_data:
    name: uts_kepl_prom_data
  grafana_data:
    name: uts_kepl_grafana_data

# Internal Bridge Network (Komunikasi via nama service)
networks:
  kepl_network:
    name: uts_kepl_network
    driver: bridge
